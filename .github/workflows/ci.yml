name: Verificar Editorial Tools
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - run: npm test
      - run: npm run build:pages
      - name: Emit updated lockfile for version upgrade (temporary)
        run: |
          echo LOCKFILE_START
          base64 -w0 package-lock.json
          echo
          echo LOCKFILE_END
  browser-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/checkout@v4
        with:
          repository: SantiagoM96/mlz
          ref: 13032f9ab2ea8b81f3d46c81ca36f4e0b4e211b7
          path: reference
          persist-credentials: false
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editorial-foundations-browser-qa
          path: |
            playwright-report/
            test-results/
            tests/artifacts/
          if-no-files-found: ignore
